name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the installed command
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          tracevault --version
          tracevault --cases smoke demo
          tracevault --cases smoke verify CASE-001
          tracevault --cases smoke verify CASE-002

  collector:
    # Runs the Windows collector for real on the runner, under Windows PowerShell 5.1 (what every
    # Windows host has) and PowerShell 7, then ingests, analyses and verifies the output.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Write the packaged collector script
        shell: pwsh
        run: tracevault collector-script windows -o "$env:RUNNER_TEMP\Collect-TraceVault.ps1"
      - name: Collect with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $since = (Get-Date).AddHours(-6).ToString('o')
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\Collect-TraceVault.ps1" `
            -Since $since -OutDir "$env:RUNNER_TEMP\c51" -Examiner ci -MaxEvents 20000 -IncludeEvtx
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Collect with PowerShell 7
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\Collect-TraceVault.ps1" -Since (Get-Date).AddHours(-6) `
            -OutDir "$env:RUNNER_TEMP\c7" -Examiner ci -MaxEvents 20000
      - name: Ingest, analyse and verify both collections
        shell: pwsh
        run: |
          $cases = "$env:RUNNER_TEMP\cases"
          foreach ($c in 'c51', 'c7') {
            Get-Content "$env:RUNNER_TEMP\$c\manifest.json"
            tracevault --cases $cases case-new "CI-$c" --examiner ci
            tracevault --cases $cases ingest-collection "CI-$c" "$env:RUNNER_TEMP\$c" --examiner ci
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            tracevault --cases $cases analyze "CI-$c" --examiner ci
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            tracevault --cases $cases verify "CI-$c"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Tampered collection is refused
        shell: pwsh
        run: |
          $f = Get-ChildItem "$env:RUNNER_TEMP\c7\*_system.jsonl" | Select-Object -First 1
          Add-Content -LiteralPath $f.FullName -Value '{"EventID":1,"TimeCreated":"2026-01-01T00:00:00.000000Z","Channel":"System","Computer":"x"}'
          tracevault --cases "$env:RUNNER_TEMP\cases" case-new CI-tamper --examiner ci
          tracevault --cases "$env:RUNNER_TEMP\cases" ingest-collection CI-tamper "$env:RUNNER_TEMP\c7"
          if ($LASTEXITCODE -eq 0) { Write-Error 'tampered collection was accepted'; exit 1 }
          Write-Host 'tampered collection refused as expected'
          exit 0

  linux-collector:
    # Runs the Linux collector for real on the runner as root, after writing a simulated SSH
    # brute force + successful login into the journal, then checks TraceVault detects it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Write the packaged collector script
        run: tracevault collector-script linux -o "$RUNNER_TEMP/collect-tracevault.sh"
      - name: Simulate an SSH brute force followed by a successful login (journal only)
        run: |
          for port in 4201 4202 4203 4204 4205 4206; do
            logger -p auth.warning -t sshd "Failed password for invalid user ci-attacker from 203.0.113.99 port $port ssh2"
          done
          logger -p auth.info -t sshd "Accepted password for ci-attacker from 203.0.113.99 port 4207 ssh2"
          sudo journalctl --sync || sleep 3
      - name: Collect as root
        run: |
          sudo bash "$RUNNER_TEMP/collect-tracevault.sh" --since "1 hour ago" --out "$RUNNER_TEMP/lc" --examiner ci
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/lc"
          cat "$RUNNER_TEMP/lc/manifest.json"
      - name: Ingest, analyse, verify and check the simulated attack was found
        run: |
          set -e
          cases="$RUNNER_TEMP/cases"
          tracevault --cases "$cases" case-new CI-linux --examiner ci
          tracevault --cases "$cases" ingest-collection CI-linux "$RUNNER_TEMP/lc" --examiner ci
          tracevault --cases "$cases" analyze CI-linux --examiner ci
          tracevault --cases "$cases" verify CI-linux
          python - "$cases/CI-linux/analysis.json" <<'EOF'
          import json, sys
          a = json.load(open(sys.argv[1]))
          hits = {f["rule_id"]: f for f in a["findings"]}
          assert "TV-101" in hits, f"brute force + login not detected; rules fired: {sorted(hits)}"
          assert "203.0.113.99" in hits["TV-101"]["entities"]["ips"], hits["TV-101"]["entities"]
          print("detected:", hits["TV-101"]["title"], "-", hits["TV-101"]["summary"])
          EOF
      - name: Tampered collection is refused
        run: |
          echo "2026-01-01T00:00:00+00:00 x sshd[1]: injected" >> "$RUNNER_TEMP/lc/"*_journal.log
          tracevault --cases "$RUNNER_TEMP/cases" case-new CI-linux-tamper --examiner ci
          if tracevault --cases "$RUNNER_TEMP/cases" ingest-collection CI-linux-tamper "$RUNNER_TEMP/lc"; then
            echo "tampered collection was accepted"; exit 1
          fi
          echo "tampered collection refused as expected"
