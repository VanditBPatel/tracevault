<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceVault</title>
<style>
  :root {
    --bg: #0b1017; --panel: #121a24; --panel-2: #182231; --line: #233042;
    --text: #e6edf5; --muted: #8696aa; --accent: #2dd4bf;
    --low: #60a5fa; --medium: #facc15; --high: #fb923c; --critical: #f43f5e; --ok: #34d399;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  .logo { font-weight: 800; letter-spacing: .5px; } .logo span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  button, select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #04201c; border-color: var(--accent); font-weight: 700; }
  .layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--line); padding: 14px; background: var(--panel); }
  aside h3 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .case-item { padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 6px; }
  .case-item:hover { background: var(--panel-2); }
  .case-item.active { border-color: var(--accent); background: var(--panel-2); }
  .case-item .cid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .case-item .ct { font-size: 13px; margin: 2px 0; }
  main { padding: 20px; min-width: 0; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .case-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .case-head h1 { margin: 0; font-size: 20px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .integrity { border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; border: 1px solid; }
  .integrity.ok { color: var(--ok); border-color: var(--ok); } .integrity.bad { color: var(--critical); border-color: var(--critical); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 18px 0; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
  .kpi .value { font-size: 28px; font-weight: 800; margin-top: 2px; }
  .kpi .hint { color: var(--muted); font-size: 12px; }
  .gauge { height: 6px; background: var(--panel-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .gauge > div { height: 100%; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .card h2 .count { color: var(--muted); font-weight: 400; }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .story li { margin-bottom: 6px; }
  .chain { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .tactic { border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-height: 76px; font-size: 11px; color: var(--muted); }
  .tactic.hit { color: var(--text); background: color-mix(in srgb, var(--sev) 14%, transparent); border-color: var(--sev); }
  .tactic .n { font-size: 20px; font-weight: 800; color: var(--sev); }
  .tactic .tech { font-family: var(--mono); font-size: 10px; }
  .sev { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: 10px; font-weight: 800; text-transform: uppercase; color: #0b1017; background: var(--c); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.finding { cursor: pointer; } tr.finding:hover td, tr.finding.sel td { background: var(--panel-2); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }
  .scroll { overflow-x: auto; }
  .timeline { max-height: 520px; overflow: auto; border-top: 1px solid var(--line); }
  .ev { display: grid; grid-template-columns: 74px 120px 110px 1fr; gap: 10px; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12px; align-items: baseline; }
  .ev.flag { border-left: 3px solid var(--critical); background: color-mix(in srgb, var(--critical) 6%, transparent); }
  .ev.hl { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .ev .msg { word-break: break-word; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .tools label { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .chip { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; margin: 1px 2px 1px 0; }
  .chip.ext { border-color: var(--critical); color: var(--critical); }
  .problems { color: var(--critical); margin: 8px 0 0; }
  .ident { padding: 4px 0; font-size: 13px; }
  .ident .aliases { font-size: 11px; margin: 2px 0 0 2px; }
  .card.posture, .card.suppressed { border-style: dashed; }
  button.small { padding: 3px 9px; font-size: 12px; }
  input[type=text], input[type=search], textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  input[type=text]:focus, input[type=search]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .examiner { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .examiner input { width: 150px; }
  .verify { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .verify .when { color: var(--muted); font-size: 11px; }
  tr.form td { background: var(--panel-2); }
  /* Log text is attacker-controlled: a long Base64 payload or path must not widen the layout. */
  tr.finding td:nth-child(3), .ev .msg, .note, .supform .cond { overflow-wrap: anywhere; }
  tr.finding td:nth-child(1), tr.finding td:nth-child(2), tr.finding td:nth-child(6) { white-space: nowrap; }
  .supform { display: grid; gap: 10px; padding: 4px 2px; }
  .supform fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0; padding: 8px 10px; min-width: 0; }
  .supform legend { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; padding: 0 4px; }
  .supform label { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 2px 0; }
  .supform .cond { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .supform textarea { width: 100%; min-height: 54px; resize: vertical; }
  .supform .actions { display: flex; gap: 8px; align-items: center; }
  .supform .err { color: var(--critical); font-size: 12px; }
  .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  @media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } .chain { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 16px; } .chain { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .ev { grid-template-columns: 64px 1fr; } .ev .src, .ev .kind { display: none; }
    header .sub { display: none; }
    header { flex-wrap: wrap; } .examiner input { width: 110px; }
    tr.finding td:nth-child(4), tr.finding td:nth-child(5), tr.fhead th:nth-child(4), tr.fhead th:nth-child(5) { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">Trace<span>Vault</span></div>
  <div class="sub">Evidence-first incident triage</div>
  <div class="spacer"></div>
  <label class="examiner">Examiner <input type="text" id="examiner" maxlength="80" placeholder="your name" autocomplete="name"></label>
  <button id="reanalyze" hidden>Re-run analysis</button>
  <button id="report" class="primary" hidden>Open report</button>
</header>
<div class="layout">
  <aside><h3>Cases</h3><div id="cases"></div></aside>
  <main id="main"><div class="empty">Loading cases...</div></main>
</div>

<script>
const SEV = ["low", "medium", "high", "critical"];
const STATUS_SEV = { created: "critical", compromised: "high", targeted: "medium", involved: "low" };
const PAGE = 200;
// Fields offered when scoping a suppression ("all findings of this rule where ...").
const SCOPE_FIELDS = ["source_image", "process", "parent_process", "target_image", "service_name", "image_path",
  "task_name", "target_object", "command_line", "event_name", "operation", "user_agent", "actor", "user", "host", "src_ip"];
const sevColor = s => `var(--${s || "line"})`;
const $ = (sel, el = document) => el.querySelector(sel);
// Log content is attacker-controlled: everything rendered goes through esc().
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const time = iso => iso ? iso.slice(11, 19) : "-";
let current = null;
let state = { sev: "all", mode: "flagged", selected: null, suppressFor: null, page: null, q: "" };

const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
};
$("#examiner").value = store.get("tv.examiner");
$("#examiner").onchange = e => store.set("tv.examiner", e.target.value.trim());

function examiner() {
  const name = $("#examiner").value.trim();
  if (!name) { $("#examiner").focus(); throw new Error("Enter your examiner name first - it is written to the custody ledger."); }
  return name;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
const caseUrl = (suffix = "") => `/api/cases/${encodeURIComponent(current.case.id)}${suffix}`;

async function loadCases(selectId) {
  const cases = await api("/api/cases");
  const box = $("#cases");
  if (!cases.length) {
    box.innerHTML = "";
    $("#main").innerHTML = `<div class="empty">No cases yet.<br><br>Run <span class="mono">tracevault demo</span> to load the sample breaches.</div>`;
    return;
  }
  box.innerHTML = cases.map(c => `
    <div class="case-item" data-id="${esc(c.id)}">
      <div class="cid">${esc(c.id)}</div>
      <div class="ct">${esc(c.title)}</div>
      <div class="muted" style="font-size:12px">${c.risk ? `<span class="sev" style="--c:${sevColor(c.risk.level)}">${esc(c.risk.level)}</span> ${c.risk.score}/100 &middot; ${c.findings} findings${c.suppressed_findings ? ` &middot; ${c.suppressed_findings} suppressed` : ""}` : "not analysed"}</div>
    </div>`).join("");
  box.querySelectorAll(".case-item").forEach(el => el.onclick = () => openCase(el.dataset.id));
  await openCase(selectId && cases.some(c => c.id === selectId) ? selectId : cases[0].id);
}

async function openCase(id, keepView = false) {
  document.querySelectorAll(".case-item").forEach(el => el.classList.toggle("active", el.dataset.id === id));
  current = await api(`/api/cases/${encodeURIComponent(id)}`);
  // The open case lives in the URL (#CASE-002), so a case can be linked to and survives reload.
  try { history.replaceState(null, "", "#" + encodeURIComponent(id)); } catch { /* sandboxed frame */ }
  if (!keepView) state = { ...state, selected: null, suppressFor: null, mode: "flagged", page: null, q: "" };
  else state = { ...state, selected: null, suppressFor: null };
  $("#reanalyze").hidden = false;
  $("#report").hidden = !current.analysis;
  render();
}

async function loadPage(append) {
  const offset = append && state.page ? state.page.events.length : 0;
  const r = await api(caseUrl(`/events?offset=${offset}&limit=${PAGE}&q=${encodeURIComponent(state.q)}`));
  state.page = append && state.page ? { total: r.total, events: state.page.events.concat(r.events) } : { total: r.total, events: r.events };
  render();
}

function findingRow(f, idx, eventsById) {
  const sup = f.suppressed;
  return `
    <tr class="finding ${idx === state.selected ? "sel" : ""}" data-idx="${idx}">
      <td class="mono">${time(f.ts)}</td>
      <td><span class="sev" style="--c:${sevColor(f.severity)}">${esc(f.severity)}</span></td>
      <td><b>${esc(f.title)}</b><div class="muted" style="font-size:12px">${esc(f.summary)}</div>
        ${sup ? `<div class="note"><b>${esc(sup.id)}</b> ${sup.verdict === "false_positive" ? "False positive" : "Expected activity"} &middot; ${esc(sup.reason)} &middot; ${esc(sup.by)}</div>` : ""}</td>
      <td class="mono">${esc(f.technique)}<div class="muted">${esc(f.tactic)}</div></td>
      <td>${[...f.entities.hosts, ...f.entities.users, ...f.entities.ips].map(x => `<span class="chip">${esc(x)}</span>`).join("")}</td>
      <td>${sup ? `<button class="small" data-restore="${esc(sup.id)}">Restore</button>` : `<button class="small" data-suppress="${idx}">Suppress</button>`}</td>
    </tr>
    ${state.suppressFor === idx ? `<tr class="form"><td colspan="6">${suppressForm(f, eventsById)}</td></tr>` : ""}`;
}

function scopeCandidates(f, eventsById) {
  const ctx = new Set(f.context_event_ids || []);
  const ev = f.event_ids.map(id => eventsById[id]).find(e => e && !ctx.has(e.id));
  if (!ev) return [];
  const value = k => ["host", "user", "src_ip"].includes(k) ? ev[k] : ev.fields[k];
  return SCOPE_FIELDS.filter(k => value(k) !== null && value(k) !== undefined && value(k) !== "")
    .map(k => ({ field: k, value: String(value(k)) }));
}

function suppressForm(f, eventsById) {
  const cands = scopeCandidates(f, eventsById);
  return `<form class="supform" id="supform">
    <div><b>Suppress ${esc(f.rule_id)} &middot; ${esc(f.title)}</b>
      <div class="note">Recorded in the custody ledger with your name and reason, shown in the report, and reversible.</div></div>
    <fieldset><legend>Verdict</legend>
      <label><input type="radio" name="verdict" value="false_positive" checked> False positive &mdash; the rule was wrong</label>
      <label><input type="radio" name="verdict" value="expected_activity"> Expected activity &mdash; real, but authorized (admin task, pentest)</label>
    </fieldset>
    <fieldset><legend>Scope</legend>
      <label><input type="radio" name="scope" value="finding" checked> Only this finding</label>
      <label><input type="radio" name="scope" value="where" ${cands.length ? "" : "disabled"}> Every ${esc(f.rule_id)} finding where all checked values match:</label>
      ${cands.map((c, i) => `<label style="padding-left:24px"><input type="checkbox" name="cond" value="${i}"><span class="cond">${esc(c.field)} = ${esc(c.value)}</span></label>`).join("")}
    </fieldset>
    <label style="display:block"><span class="muted" style="font-size:12px">Reason (required)</span>
      <textarea name="reason" maxlength="2000" placeholder="e.g. Azure VM agent collecting logs; confirmed with cloud team"></textarea></label>
    <div class="actions"><button type="submit" class="primary small">Suppress &amp; re-analyse</button>
      <button type="button" class="small" id="supcancel">Cancel</button><span class="err" id="superr"></span></div>
  </form>`;
}

function render() {
  const { case: c, analysis: a, verification: v, ledger, suppressions: sups } = current;
  const main = $("#main");
  const checked = v.checked_at ? v.checked_at.replace("T", " ").slice(0, 16) + " UTC" : "";
  const head = `
    <div class="case-head">
      <div><h1>${esc(c.title)}</h1>
        <div class="meta"><span class="mono">${esc(c.id)}</span> &middot; examiner ${esc(c.examiner)} &middot; opened ${esc(c.created_at)}</div></div>
      <div class="verify"><span class="integrity ${v.ok ? "ok" : "bad"}">${v.ok ? "&#10003; Evidence integrity verified" : "&#9888; Integrity check failed"}</span>
        <span class="when">checked ${esc(checked)}</span><button class="small" id="reverify">Re-verify</button></div>
    </div>`;
  if (!a) {
    main.innerHTML = head + `<div class="card" style="margin-top:16px">${ledger.length} ledger entries. This case has not been analysed yet &mdash; click <b>Re-run analysis</b>.</div>`;
    bindCommon();
    return;
  }
  const s = a.stats, r = a.risk;
  const eventsById = Object.fromEntries(a.finding_events.map(e => [e.id, e]));
  const dwell = s.dwell ? `${time(s.dwell[0]).slice(0,5)} &rarr; ${time(s.dwell[1]).slice(0,5)}` : "-";
  const live = f => !f.suppressed;
  const isAttack = f => (f.category || "attack") === "attack";
  const indexed = a.findings.map((f, i) => [f, i]);
  const attack = indexed.filter(([f]) => live(f) && isAttack(f) && (state.sev === "all" || f.severity === state.sev));
  const posture = indexed.filter(([f]) => live(f) && !isAttack(f));
  const suppressed = indexed.filter(([f]) => !live(f));
  const sel = state.selected != null ? a.findings[state.selected] : null;
  const hl = new Set(sel ? sel.event_ids : []);

  let events, timelineLabel, tools;
  if (sel) {
    events = sel.event_ids.map(id => eventsById[id]).filter(Boolean);
    timelineLabel = `${events.length} evidence events`;
    tools = `<span>Evidence for <b>${esc(sel.title)}</b></span><button class="small" id="clearSel">Back to timeline</button>`;
  } else if (state.mode === "all") {
    events = state.page ? state.page.events : [];
    timelineLabel = state.page ? `${events.length} of ${state.page.total.toLocaleString()}${state.q ? " matching" : ""} events` : "loading...";
    tools = `<label><input type="checkbox" id="flagOnly"> Flagged events only</label>
      <input type="search" id="q" placeholder="Search message, host, user, kind, IP" value="${esc(state.q)}" style="flex:1;min-width:160px">`;
  } else {
    events = a.finding_events.filter(e => e.rules.length);
    timelineLabel = `${events.length} flagged of ${a.timeline_total.toLocaleString()} events`;
    tools = `<label><input type="checkbox" id="flagOnly" checked> Flagged events only</label>`;
  }
  const more = !sel && state.mode === "all" && state.page && events.length < state.page.total;

  main.innerHTML = head + `
    <div class="kpis">
      <div class="kpi"><div class="label">Risk score</div><div class="value" style="color:${sevColor(r.level)}">${r.score}<span class="muted" style="font-size:14px">/100</span></div>
        <div class="gauge"><div style="width:${r.score}%;background:${sevColor(r.level)}"></div></div></div>
      <div class="kpi"><div class="label">Findings</div><div class="value">${s.findings}</div>
        <div class="hint">${SEV.slice().reverse().map(x => `${s.by_severity[x]} ${x}`).join(" &middot; ")}${s.posture_findings ? ` &middot; +${s.posture_findings} posture` : ""}${s.suppressed_findings ? ` &middot; ${s.suppressed_findings} suppressed` : ""}</div></div>
      <div class="kpi"><div class="label">Events</div><div class="value">${s.events.toLocaleString()}</div><div class="hint">${s.flagged_events} flagged across ${Object.keys(s.by_source).length} artifacts</div></div>
      <div class="kpi"><div class="label">Attacker window (UTC)</div><div class="value" style="font-size:22px">${dwell}</div><div class="hint">${s.dwell ? esc(s.dwell[0].slice(0,10)) : ""}</div></div>
    </div>

    <div class="grid2">
      <div class="card"><h2>Storyline</h2><ul class="story">${a.narrative.map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>
      <div class="card"><h2>Indicators of compromise</h2>
        <div class="muted" style="font-size:11px;margin-bottom:4px">IP ADDRESSES</div>
        ${a.iocs.ips.map(x => `<span class="chip ${x.external ? "ext" : ""}" title="${x.external ? "external" : "internal"}">${esc(x.value)} &times;${x.findings}</span>`).join("") || '<span class="muted">none</span>'}
        <div class="muted" style="font-size:11px;margin:10px 0 4px">IDENTITIES</div>
        ${(a.identities || []).map(i => `
          <div class="ident">
            <span class="sev" style="--c:${sevColor(STATUS_SEV[i.status])}">${esc(i.status)}</span>
            <b>${esc(i.identity)}</b> <span class="muted">${esc(i.systems.join(", "))}</span>
            ${i.aliases.length > 1 ? `<div class="muted aliases">linked ${esc(i.linked_by)}: ${i.aliases.map(x => `<span class="mono">${esc(x)}</span>`).join(", ")}</div>` : ""}
          </div>`).join("") || '<span class="muted">none</span>'}
        <div class="muted" style="font-size:11px;margin:10px 0 4px">HOSTS &amp; TENANTS</div>
        ${a.iocs.hosts.map(x => `<span class="chip">${esc(x.value)} &times;${x.findings}</span>`).join("") || '<span class="muted">none</span>'}
      </div>
    </div>

    <div class="card"><h2>MITRE ATT&amp;CK kill chain</h2>
      <div class="chain">${a.attack_chain.map(t => `
        <div class="tactic ${t.count ? "hit" : ""}" style="--sev:${sevColor(t.max_severity)}">
          <div><b>${esc(t.tactic)}</b></div><div class="n">${t.count || ""}</div>
          ${t.techniques.map(x => `<div class="tech" title="${esc(x.name)}">${esc(x.id)}</div>`).join("")}
        </div>`).join("")}</div>
    </div>

    <div class="card"><h2>Findings <span class="count">${attack.length}</span></h2>
      <div class="tools"><label>Severity <select id="sevFilter">
        ${["all", ...SEV.slice().reverse()].map(x => `<option ${x === state.sev ? "selected" : ""}>${x}</option>`).join("")}
      </select></label><span class="muted" style="font-size:12px">Click a finding to see its evidence. Suppress what you have reviewed as noise.</span></div>
      <div class="scroll"><table>
        <tr class="fhead"><th>Time</th><th>Severity</th><th>Finding</th><th>ATT&amp;CK</th><th>Entities</th><th></th></tr>
        ${attack.map(([f, i]) => findingRow(f, i, eventsById)).join("") || `<tr><td colspan="6" class="muted">No findings${state.sev !== "all" ? " at this severity" : ""}.</td></tr>`}
      </table></div>
    </div>

    ${posture.length ? `<div class="card posture"><h2>Security posture issues <span class="count">${posture.length}</span></h2>
      <div class="note" style="margin-bottom:8px">Risky practices worth fixing. Not counted as attacker activity, the risk score, IOCs or the attacker window.</div>
      <div class="scroll"><table>
        <tr class="fhead"><th>Time</th><th>Severity</th><th>Finding</th><th>ATT&amp;CK</th><th>Entities</th><th></th></tr>
        ${posture.map(([f, i]) => findingRow(f, i, eventsById)).join("")}
      </table></div>
    </div>` : ""}

    ${suppressed.length || sups.revoked.length ? `<div class="card suppressed"><h2>Suppressed by analyst <span class="count">${suppressed.length}</span></h2>
      <div class="note" style="margin-bottom:8px">Excluded from the storyline, risk score, IOCs and identities. Each decision is a custody-ledger entry and appears in the report.</div>
      ${suppressed.length ? `<div class="scroll"><table>
        <tr class="fhead"><th>Time</th><th>Severity</th><th>Finding</th><th>ATT&amp;CK</th><th>Entities</th><th></th></tr>
        ${suppressed.map(([f, i]) => findingRow(f, i, eventsById)).join("")}
      </table></div>` : ""}
      ${sups.active.filter(x => !a.findings.some(f => f.suppressed && f.suppressed.id === x.id)).map(x =>
        `<div class="note"><b>${esc(x.id)}</b> active but currently matches nothing: ${esc(x.reason)}</div>`).join("")}
      ${sups.revoked.map(x => `<div class="note">Withdrawn <b>${esc(x.id)}</b> by ${esc(x.revoked_by)}: ${esc(x.revoke_reason)}</div>`).join("")}
    </div>` : ""}

    <div class="card"><h2>Super-timeline <span class="count">${timelineLabel}</span></h2>
      <div class="tools">${tools}</div>
      <div class="timeline">${events.map(e => `
        <div class="ev ${e.rules.length ? "flag" : ""} ${hl.has(e.id) ? "hl" : ""}">
          <span class="mono">${time(e.ts)}</span>
          <span class="mono src muted" title="${esc(e.source)}">${esc(e.host)}</span>
          <span class="mono kind">${esc(e.kind)}</span>
          <span class="msg">${esc(e.message)} ${e.rules.map(rid => `<span class="chip">${esc(rid)}</span>`).join("")}</span>
        </div>`).join("") || '<div class="ev"><span></span><span class="muted msg">No events.</span></div>'}</div>
      ${more ? `<div class="tools" style="margin-top:10px"><button class="small" id="more">Load ${Math.min(PAGE, state.page.total - events.length)} more</button></div>` : ""}
    </div>

    <div class="card"><h2>Chain of custody <span class="count">${ledger.length} entries</span></h2>
      <div class="muted" style="font-size:12px">Ledger head <span class="mono">${esc(v.head || "-")}</span></div>
      ${v.problems.length ? `<ul class="problems">${v.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
      <div class="scroll" style="margin-top:10px"><table>
        <tr><th>#</th><th>Time</th><th>Actor</th><th>Action</th><th>Subject</th><th>SHA-256</th><th>Status</th></tr>
        ${ledger.map(e => { const ev = v.evidence.find(x => x.file === e.evidence); const d = e.details || {};
          const subject = e.evidence || (d.id ? `${d.id}${d.rule_id ? " " + d.rule_id : ""}${d.reason ? " - " + d.reason : ""}` : "");
          return `
          <tr><td>${e.seq}</td><td class="mono">${esc(e.ts.replace("T", " ").slice(0, 19))}</td><td>${esc(e.actor)}</td>
          <td class="mono">${esc(e.action)}</td><td>${esc(subject)}</td>
          <td class="mono" title="${esc(e.sha256 || "")}">${esc((e.sha256 || "").slice(0, 16))}</td>
          <td>${ev ? (ev.ok ? '<span style="color:var(--ok)">&#10003; match</span>' : '<span style="color:var(--critical)">&#10007; changed</span>') : ""}</td></tr>`; }).join("")}
      </table></div>
    </div>`;

  bindCommon();
  $("#sevFilter").onchange = e => { state.sev = e.target.value; render(); };
  main.querySelectorAll("tr.finding").forEach(tr => tr.onclick = ev => {
    if (ev.target.closest("button")) return;
    const idx = Number(tr.dataset.idx);
    state.selected = state.selected === idx ? null : idx;
    render();
  });
  main.querySelectorAll("[data-suppress]").forEach(b => b.onclick = () => {
    const idx = Number(b.dataset.suppress);
    state.suppressFor = state.suppressFor === idx ? null : idx;
    render();
  });
  main.querySelectorAll("[data-restore]").forEach(b => b.onclick = () => restore(b.dataset.restore));
  const flag = $("#flagOnly");
  if (flag) flag.onchange = e => { state.mode = e.target.checked ? "flagged" : "all"; if (state.mode === "all") loadPage(false).catch(err => alert(err.message)); else render(); };
  const q = $("#q");
  if (q) q.onkeydown = e => { if (e.key === "Enter") { state.q = q.value.trim(); loadPage(false).catch(err => alert(err.message)); } };
  const moreBtn = $("#more"); if (moreBtn) moreBtn.onclick = () => loadPage(true).catch(err => alert(err.message));
  const clear = $("#clearSel"); if (clear) clear.onclick = () => { state.selected = null; render(); };
  const form = $("#supform");
  if (form) {
    const f = a.findings[state.suppressFor];
    const cands = scopeCandidates(f, eventsById);
    $("#supcancel").onclick = () => { state.suppressFor = null; render(); };
    form.querySelectorAll('input[name="cond"]').forEach(cb => cb.onchange = () => { form.querySelector('input[name="scope"][value="where"]').checked = true; });
    form.onsubmit = async e => {
      e.preventDefault();
      const err = $("#superr"); err.textContent = "";
      const fd = new FormData(form);
      const body = { rule_id: f.rule_id, verdict: fd.get("verdict"), reason: String(fd.get("reason") || "").trim(), scope: fd.get("scope") };
      if (body.scope === "finding") body.fingerprints = f.attributed_fps;
      else body.conditions = fd.getAll("cond").map(i => ({ field: cands[i].field, op: "equals", value: cands[i].value }));
      try {
        body.examiner = examiner();
        if (body.reason.length < 5) throw new Error("Give a reason (at least 5 characters).");
        if (body.scope === "where" && !body.conditions.length) throw new Error("Tick at least one value to match.");
        form.querySelector('button[type="submit"]').disabled = true;
        err.textContent = "Saving and re-analysing...";
        await post(caseUrl("/suppressions"), body);
        await loadCases(current.case.id);
      } catch (x) { err.textContent = x.message; form.querySelector('button[type="submit"]').disabled = false; }
    };
  }
}

function bindCommon() {
  $("#reverify").onclick = async () => {
    const b = $("#reverify"); b.disabled = true; b.textContent = "Verifying...";
    try { current.verification = await post(caseUrl("/verify")); render(); }
    catch (err) { alert(err.message); b.disabled = false; b.textContent = "Re-verify"; }
  };
}

async function restore(id) {
  try {
    const name = examiner();
    const reason = prompt(`Why restore ${id}? (recorded in the custody ledger)`);
    if (reason === null) return;
    await post(caseUrl(`/suppressions/${encodeURIComponent(id)}/revoke`), { examiner: name, reason });
    await loadCases(current.case.id);
  } catch (err) { alert(err.message); }
}

$("#report").onclick = () => window.open(caseUrl("/report"), "_blank");
$("#reanalyze").onclick = async () => {
  const btn = $("#reanalyze");
  try {
    const name = examiner();
    btn.disabled = true; btn.textContent = "Analysing...";
    await post(caseUrl("/analyze"), { examiner: name });
    await loadCases(current.case.id);
  } catch (err) { alert(err.message); }
  finally { btn.disabled = false; btn.textContent = "Re-run analysis"; }
};
const caseFromUrl = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch { return ""; } };
loadCases(caseFromUrl()).catch(err => { $("#main").innerHTML = `<div class="empty">Failed to load: ${esc(err.message)}</div>`; });
</script>
</body>
</html>
